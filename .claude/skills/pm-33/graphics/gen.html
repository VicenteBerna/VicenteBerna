<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Montserrat;font-weight:400;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-400-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:600;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-600-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:800;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-800-normal.woff2)}
@font-face{font-family:Montserrat;font-weight:900;src:url(node_modules/@fontsource/montserrat/files/montserrat-latin-900-normal.woff2)}
@font-face{font-family:Playfair;font-style:italic;font-weight:400;src:url(node_modules/@fontsource/playfair-display/files/playfair-display-latin-400-italic.woff2)}
@font-face{font-family:Playfair;font-weight:700;src:url(node_modules/@fontsource/playfair-display/files/playfair-display-latin-700-normal.woff2)}
:root{--bg:#0E0F12;--ink:#F2EFE8;--gold:#D4A84B;--red:#C8553D;--mute:#8A8F98;--line:#2A2C33}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1920px;height:1080px;background:#000;overflow:hidden}
#stage{width:1920px;height:1080px;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#1a1c22 0%,var(--bg) 55%,#050506 100%);font-family:Montserrat;color:var(--ink)}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='200' height='200' filter='url(%23n)'/></svg>")}
#cam{position:absolute;inset:0;transform-origin:50% 50%}
.brand{position:absolute;left:96px;bottom:64px;font-weight:800;letter-spacing:.32em;font-size:18px;color:var(--mute)}
.brand b{color:var(--gold)}
.src{position:absolute;right:96px;bottom:64px;font-size:20px;color:var(--mute);max-width:1300px;text-align:right}
.center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 160px}
.kicker{font-weight:600;font-size:34px;letter-spacing:.28em;color:var(--mute);text-transform:uppercase}
.big{font-weight:900;line-height:1.02;letter-spacing:-.01em}
.mid{font-weight:800;font-size:76px;line-height:1.12}
.sub{font-weight:600;font-size:44px;line-height:1.3;max-width:1500px;opacity:.92}
.gold{color:var(--gold)} .red{color:var(--red)} .mute{color:var(--mute)}
.rule{width:140px;height:6px;background:var(--gold);margin:40px auto}
.quote{font-family:Playfair;font-style:italic;font-size:70px;line-height:1.3;max-width:1560px}
.hl{background-image:linear-gradient(rgba(212,168,75,.55),rgba(212,168,75,.55));background-repeat:no-repeat;background-position:0 88%;background-size:0% 34%}
.who{margin-top:44px;font-size:28px;letter-spacing:.16em;color:var(--mute);text-transform:uppercase;font-weight:600}
.chap{border:2px solid var(--gold);padding:44px 90px}
.chapn{font-weight:800;font-size:36px;letter-spacing:.5em;color:var(--gold)}
.chapt{font-family:Playfair;font-weight:700;font-size:104px;margin-top:22px}
.rows{display:grid;grid-template-columns:auto 1fr;gap:26px 48px;text-align:left;margin-top:46px;align-items:baseline}
.rl{font-weight:600;font-size:30px;letter-spacing:.2em;color:var(--mute);text-transform:uppercase;white-space:nowrap}
.rv{font-weight:800;font-size:52px;line-height:1.15}
.cols{display:flex;gap:120px;margin-top:40px;align-items:flex-start}
.col{width:640px}
.colv{font-weight:900;font-size:150px;line-height:1}
.coll{font-weight:600;font-size:34px;line-height:1.3;margin-top:18px}
.vs{font-weight:800;font-size:40px;color:var(--mute);align-self:center}
svg text{font-family:Montserrat}
[data-in]{opacity:0}
</style></head><body>
<div id="stage"><div id="cam"></div><div id="grain"></div></div>
<script>
const ease=t=>t<0?0:t>1?1:1-Math.pow(1-t,3);
const fmt=(v,d)=>v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
function el(h){const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild}
const BRAND='<div class="brand">PROFIT<b>MOMENTS</b></div>';
const SRC=s=>s?`<div class="src" data-in="0.6">${s}</div>`:'';
// builders: each returns html; elements with data-in="startSec" fade+rise in
const B={
 kinetic:s=>`<div class="center">${s.lines.map((l,i)=>`<div data-in="${l.at??i*0.5}" class="${l.cls||'big'}" style="${l.style||''}">${l.text}</div>`).join('')}</div>${BRAND}${SRC(s.source)}`,
 number:s=>`<div class="center"><div class="kicker" data-in="0">${s.kicker}</div>
   <div class="big" style="font-size:${s.size||250}px;margin-top:26px" data-in="0.3"><span class="${s.color||''}" data-count="${s.value}" data-dec="${s.dec||0}" data-pre="${s.pre||''}" data-suf="${s.suf||''}">0</span></div>
   <div class="rule" data-in="1.2"></div><div class="sub" data-in="1.5">${s.sub||''}</div></div>${BRAND}${SRC(s.source)}`,
 quote:s=>`<div class="center"><div class="quote" data-in="0">“${s.text.replace(/\[\[(.+?)\]\]/g,'<span class="hl">$1</span>')}”</div><div class="who" data-in="0.8">${s.who}</div></div>${BRAND}`,
 chapter:s=>`<div class="center"><div class="chap" data-in="0"><div class="chapn">${s.n}</div><div class="chapt">${s.title}</div></div></div>${BRAND}`,
 rows:s=>`<div class="center"><div class="kicker" data-in="0">${s.kicker}</div><div class="mid" data-in="0.3" style="margin-top:18px">${s.title}</div>
   <div class="rows">${s.rows.map((r,i)=>`<div class="rl" data-in="${0.9+i*0.6}">${r[0]}</div><div class="rv ${r[2]||''}" data-in="${0.9+i*0.6}">${r[1]}</div>`).join('')}</div></div>${BRAND}${SRC(s.source)}`,
 compare:s=>`<div class="center"><div class="kicker" data-in="0">${s.kicker}</div><div class="cols">
   ${s.cols.map((c,i)=>`${i?'<div class="vs" data-in="1">'+(s.vs||'vs')+'</div>':''}<div class="col" data-in="${0.4+i*1.0}"><div class="colv ${c.color||''}" style="font-size:${c.size||150}px"><span data-count="${c.value}" data-dec="${c.dec||0}" data-pre="${c.pre||''}" data-suf="${c.suf||''}">0</span></div><div class="coll">${c.label}</div></div>`).join('')}
   </div>${s.foot?`<div class="sub" data-in="2.4" style="margin-top:56px">${s.foot}</div>`:''}</div>${BRAND}${SRC(s.source)}`,
 chart:s=>`<div style="position:absolute;left:150px;top:110px"><div class="kicker" data-in="0" style="text-align:left">${s.kicker}</div><div class="big" data-in="0.2" style="font-size:76px;margin-top:16px">${s.title}</div></div>
   <svg id="ch" width="1920" height="1080" style="position:absolute;inset:0"></svg>${BRAND}${SRC(s.source)}`
};
let S, DUR;
function build(spec){S=spec;DUR=spec.dur||6;const cam=document.getElementById('cam');cam.innerHTML=B[spec.type](spec);
 if(spec.type==='chart')drawChart(spec);}
function drawChart(s){const svg=document.getElementById('ch');const xs=s.points.map(p=>p[0]);
 const x0=260,x1=1660,mn=Math.min(...xs),mx=Math.max(...xs);const X=m=>x0+(m-mn)/(mx-mn)*(x1-x0);const Y=v=>860-v/s.ymax*520;
 let g=`<defs><clipPath id="cp"><rect id="cr" x="0" y="0" width="0" height="1080"/></clipPath></defs>`;
 for(const v of s.ticks)g+=`<line x1="230" x2="1720" y1="${Y(v)}" y2="${Y(v)}" stroke="#2A2C33" stroke-width="2"/><text x="200" y="${Y(v)+10}" fill="#8A8F98" font-size="26" text-anchor="end">${v}${s.unit||''}</text>`;
 let d='';const P=s.points;
 for(let i=1;i<P.length;i++){const a=P[i-1],b=P[i];const gap=(b[0]-a[0])>1;const col=b[4]||'#D4A84B';
  d+=`<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(b[0])}" y2="${Y(b[1])}" stroke="${col}" stroke-width="8" ${gap?'stroke-dasharray="18 16"':''} stroke-linecap="round"/>`;}
 for(const [m,v,l,lab,col] of P){d+=`<circle cx="${X(m)}" cy="${Y(v)}" r="14" fill="#0E0F12" stroke="${col||'#D4A84B'}" stroke-width="7"/>`;
  if(lab)d+=`<text x="${X(m)+(lab.dx||0)}" y="${Y(v)+(lab.dy||-40)}" fill="${col||'#D4A84B'}" font-size="64" font-weight="900" text-anchor="${lab.anchor||'middle'}">${lab.t}</text>`;}
 g+=`<g clip-path="url(#cp)">${d}</g>`;
 for(const [m,v,l] of P)g+=`<text x="${X(m)}" y="915" fill="#8A8F98" font-size="28" font-weight="600" text-anchor="middle" letter-spacing="4">${l}</text>`;
 svg.innerHTML=g;}
function setT(t){ // t in seconds
 const k=Math.min(1,t/DUR); document.getElementById('cam').style.transform=`scale(${1+0.035*k})`; // slow push-in: nothing static
 document.querySelectorAll('[data-in]').forEach(e=>{const a=ease((t-parseFloat(e.dataset.in))/0.7);e.style.opacity=a;e.style.transform=`translateY(${(1-a)*24}px)`;});
 document.querySelectorAll('[data-count]').forEach(e=>{const host=e.closest('[data-in]');const st=host?parseFloat(host.dataset.in):0;const a=ease((t-st)/1.6);
   e.textContent=e.dataset.pre+fmt(parseFloat(e.dataset.count)*a,parseInt(e.dataset.dec))+e.dataset.suf;});
 document.querySelectorAll('.hl').forEach((e,i)=>{const a=ease((t-1.2-i*0.4)/0.8);e.style.backgroundSize=`${a*100}% 34%`;});
 const cr=document.getElementById('cr');if(cr){const a=ease((t-0.6)/(S.draw||3.5));cr.setAttribute('width',230+a*1520);}
}
window.build=build;window.setT=setT;
</script></body></html>
